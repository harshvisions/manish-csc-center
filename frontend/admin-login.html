<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login - Manish CSC Center & Electronics Shop</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><rect width=%2264%22 height=%2264%22 rx=%2212%22 fill=%22%231e69d6%22/><text x=%2232%22 y=%2242%22 font-family=%22Arial%22 font-size=%2228%22 font-weight=%22bold%22 fill=%22white%22 text-anchor=%22middle%22>M</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="admin-header">
    <div class="container">
      <div class="admin-brand">
        <img class="brand-logo" src="images/logo.png" alt="Manish CSC Center logo" />
        <div>
          <h1>Manish CSC Center &amp; Electronics Shop</h1>
          <p>Admin Login</p>
        </div>
      </div>
      <a href="/" class="back-link">&larr; Back to site</a>
    </div>
  </header>

  <main class="admin-main login-page-main">
    <section class="panel admin-login">
      <h2>Admin Login</h2>
      <form id="login-form">
        <div class="form-group">
          <label for="admin-id">ID</label>
          <input type="text" id="admin-id" autocomplete="username" required autofocus>
        </div>
        <div class="form-group">
          <label for="admin-password">Password</label>
          <input type="password" id="admin-password" autocomplete="current-password" required>
        </div>
        <div id="login-error" class="form-error" hidden></div>
        <button type="submit" class="btn-submit">Login</button>
      </form>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
